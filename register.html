<div class="register-container">
    <h1>账号注册</h1>
    <form class="register-form">
        <div class="form-row">
            <label>证件类型:</label>
            <select required>
                <option value="">请选择证件类型</option>
                <option value="idcard">居民身份证</option>
                <option value="hk_macau_pass">港澳居民来往内地通行证</option>
                <option value="taiwan_pass">台湾居民来往大陆通行证</option>
                <option value="hk_macau_residence">港澳居民居住证</option>
                <option value="taiwan_residence">台湾居民居住证</option>
                <option value="foreigner_residence">外国人永久居留身份证</option>
            </select>
        </div>

        <div class="form-row">
            <label>姓名:</label>
            <input type="text" placeholder="请输入真实姓名" required>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>证件号码:</label>
            <input type="text" placeholder="请输入证件号码" required>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>证件有效期:</label>
            <div class="date-range">
                <input type="date" placeholder="起始时间" required>
                <span>至</span>
                <input type="date" placeholder="结束时间" required>
            </div>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>手机号码:</label>
            <input type="tel" placeholder="请输入手机号码" required>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>图片验证码:</label>
            <div class="captcha-group">
                <input type="text" placeholder="请输入验证码" required>
                <img src="images/captcha.jpg" alt="验证码" class="captcha-img">
            </div>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>短信验证码:</label>
            <div class="code-group">
                <input type="text" placeholder="请输入短信验证码" required>
                <button type="button" class="get-code-btn">获取验证码</button>
            </div>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>登录密码:</label>
            <input type="password" placeholder="密码长度6-16位，含数字/字母" required>
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label>确认密码:</label>
            <input type="password" placeholder="请再次输入密码" required>
            <span class="required">*</span>
        </div>

        <div class="form-row agree-row">
            <div class="agree-content">
                <input type="checkbox" id="agree" required>
                <label for="agree">我已阅读并同意《用户服务协议》及《隐私政策声明》</label>
            </div>
        </div>

        <div class="form-row submit-row">
            <button type="submit">立即注册</button>
        </div>
    </form>
</div>

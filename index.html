<!-- 轮播JS + 页眉悬停显示逻辑 -->
<script>
// 轮播功能
let imgs = document.querySelectorAll('.banner_pic img');
let index = 0;

function slide() {
    imgs.forEach(img => img.classList.remove('active'));
    index = (index + 1) % imgs.length;
    imgs[index].classList.add('active');
}
setInterval(slide, 5000);
